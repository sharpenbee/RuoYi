<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('用户操作统计')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="userstat-form">
					<div class="select-list">
						<ul>
							<li class="select-time">
								<label>操作时间： </label>
								<input type="text" class="time-input" id="startTime" placeholder="开始时间"/>
								<span>-</span>
								<input type="text" class="time-input" id="endTime" placeholder="结束时间"/>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="searchPre()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="resetPre()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>
			
			<div class="col-sm-12">
				<div class="row">
					<!-- 用户操作次数排行 -->
					<div class="col-sm-6">
						<div class="ibox float-e-margins">
							<div class="ibox-title">
								<h5>用户操作次数排行（Top 10）</h5>
								<div class="ibox-tools">
									<a class="collapse-link">
										<i class="fa fa-chevron-up"></i>
									</a>
								</div>
							</div>
							<div class="ibox-content">
								<table id="top10-table" class="table table-striped table-bordered table-hover">
									<thead>
										<tr>
											<th>用户名</th>
											<th>操作次数</th>
											<th>最后操作时间</th>
										</tr>
									</thead>
									<tbody id="top10-tbody">
									</tbody>
								</table>
							</div>
						</div>
					</div>
					
					<!-- 操作时间段分布 -->
					<div class="col-sm-6">
						<div class="ibox float-e-margins">
							<div class="ibox-title">
								<h5>操作时间段分布</h5>
								<div class="ibox-tools">
									<a class="collapse-link">
										<i class="fa fa-chevron-up"></i>
									</a>
								</div>
							</div>
							<div class="ibox-content">
								<canvas id="timeDistributionChart" width="400" height="200"></canvas>
							</div>
						</div>
					</div>
				</div>
				
				<!-- 用户常用模块统计 -->
				<div class="col-sm-12">
					<div class="ibox float-e-margins">
						<div class="ibox-title">
							<h5>用户常用模块统计</h5>
							<div class="ibox-tools">
								<a class="collapse-link">
									<i class="fa fa-chevron-up"></i>
								</a>
							</div>
						</div>
						<div class="ibox-content">
							<table id="module-table" class="table table-striped table-bordered table-hover">
								<thead>
									<tr>
										<th>用户名</th>
										<th>模块名称</th>
										<th>操作次数</th>
									</tr>
								</thead>
								<tbody id="module-tbody">
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<th:block th:include="include :: footer" />
	<script th:src="@{/ajax/libs/Chart.js/Chart.min.js}"></script>
	<script th:inline="javascript">
		var prefix = ctx + "monitor/userstat";
		var timeDistributionChart;

		$(function() {
			// 设置默认时间范围（最近30天）
			var endDate = new Date();
			var startDate = new Date();
			startDate.setDate(startDate.getDate() - 30);
			
			$("#startTime").val($.common.dateFormat(startDate, "yyyy-MM-dd"));
			$("#endTime").val($.common.dateFormat(endDate, "yyyy-MM-dd"));
			
			// 初始化图表
			initChart();
			
			// 加载数据
			loadData();
		});
		
		function initChart() {
			var ctx = document.getElementById('timeDistributionChart').getContext('2d');
			timeDistributionChart = new Chart(ctx, {
				type: 'line',
				data: {
					labels: [],
					datasets: [{
						label: '操作次数',
						data: [],
						backgroundColor: 'rgba(54, 162, 235, 0.2)',
						borderColor: 'rgba(54, 162, 235, 1)',
						borderWidth: 1
					}]
				},
				options: {
					responsive: true,
					scales: {
						yAxes: [{
							ticks: {
								beginAtZero: true
							}
						}]
					}
				}
			});
		}
		
		function loadData() {
			var beginTime = $("#startTime").val();
			var endTime = $("#endTime").val();
			
			// 加载用户操作次数排行
			$.ajax({
				url: prefix + "/top10",
				type: "post",
				data: {
					beginTime: beginTime,
					endTime: endTime
				},
				success: function(result) {
					if (result.code == web_status.SUCCESS) {
						loadTop10Data(result.data);
					}
				}
			});
			
			// 加载用户常用模块统计
			$.ajax({
				url: prefix + "/modules",
				type: "post",
				data: {
					beginTime: beginTime,
					endTime: endTime
				},
				success: function(result) {
					if (result.code == web_status.SUCCESS) {
						loadModuleData(result.data);
					}
				}
			});
			
			// 加载操作时间段分布
			$.ajax({
				url: prefix + "/distribution",
				type: "post",
				data: {
					beginTime: beginTime,
					endTime: endTime
				},
				success: function(result) {
					if (result.code == web_status.SUCCESS) {
						loadDistributionData(result.data);
					}
				}
			});
		}
		
		function loadTop10Data(data) {
			var html = '';
			for (var i = 0; i < data.length; i++) {
				var item = data[i];
				html += '<tr>';
				html += '<td>' + item.operName + '</td>';
				html += '<td>' + item.totalCount + '</td>';
				html += '<td>' + item.lastOperTime + '</td>';
				html += '</tr>';
			}
			$("#top10-tbody").html(html);
		}
		
		function loadModuleData(data) {
			var html = '';
			for (var i = 0; i < data.length; i++) {
				var item = data[i];
				html += '<tr>';
				html += '<td>' + item.operName + '</td>';
				html += '<td>' + item.title + '</td>';
				html += '<td>' + item.count + '</td>';
				html += '</tr>';
			}
			$("#module-tbody").html(html);
		}
		
		function loadDistributionData(data) {
			var labels = [];
			var values = [];
			
			for (var i = 0; i < data.length; i++) {
				labels.push(data[i].date);
				values.push(data[i].count);
			}
			
			timeDistributionChart.data.labels = labels;
			timeDistributionChart.data.datasets[0].data = values;
			timeDistributionChart.update();
		}
		
		function searchPre() {
			loadData();
		}
		
		function resetPre() {
			// 重置时间范围
			var endDate = new Date();
			var startDate = new Date();
			startDate.setDate(startDate.getDate() - 30);
			
			$("#startTime").val($.common.dateFormat(startDate, "yyyy-MM-dd"));
			$("#endTime").val($.common.dateFormat(endDate, "yyyy-MM-dd"));
			
			// 重新加载数据
			loadData();
		}
	</script>
</body>
</html>
