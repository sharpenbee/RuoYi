<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('用户操作统计')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="userstat-form">
					<div class="select-list">
						<ul>
							<li class="select-time">
								<label>操作时间： </label>
								<input type="text" class="time-input" id="startTime" placeholder="开始时间" />
								<span>-</span>
								<input type="text" class="time-input" id="endTime" placeholder="结束时间" />
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="searchPre()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="resetPre()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>
			
			<!-- 用户操作次数排行 -->
			<div class="col-sm-12">
				<div class="ibox float-e-margins">
					<div class="ibox-title">
						<h5><i class="fa fa-bar-chart"></i> 用户操作次数排行（Top 10）</h5>
						<div class="ibox-tools">
							<a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
						</div>
					</div>
					<div class="ibox-content">
						<table id="userOperRank-table" class="table table-striped table-bordered table-hover"></table>
					</div>
				</div>
			</div>
			
			<!-- 用户常用模块统计 -->
			<div class="col-sm-12">
				<div class="ibox float-e-margins">
					<div class="ibox-title">
						<h5><i class="fa fa-pie-chart"></i> 用户常用模块统计</h5>
						<div class="ibox-tools">
							<a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
						</div>
					</div>
					<div class="ibox-content">
						<table id="userCommonModule-table" class="table table-striped table-bordered table-hover"></table>
					</div>
				</div>
			</div>
			
			<!-- 操作时间段分布 -->
			<div class="col-sm-12">
				<div class="ibox float-e-margins">
					<div class="ibox-title">
						<h5><i class="fa fa-line-chart"></i> 操作时间段分布</h5>
						<div class="ibox-tools">
							<a class="collapse-link"><i class="fa fa-chevron-up"></i></a>
						</div>
					</div>
					<div class="ibox-content">
						<table id="operTimeDistribution-table" class="table table-striped table-bordered table-hover"></table>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var prefix = ctx + "monitor/userstat";

		$(function() {
			// 初始化日期范围
			initDateRange();
			
			// 加载用户操作次数排行
			loadUserOperRank();
			
			// 加载用户常用模块统计
			loadUserCommonModule();
			
			// 加载操作时间段分布
			loadOperTimeDistribution();
		});

		// 初始化日期范围（默认最近30天）
        function initDateRange() {
			var endTime = new Date();
			var startTime = new Date();
			startTime.setDate(endTime.getDate() - 30);
			
			$('#startTime').val($.common.dateFormat(startTime, 'yyyy-MM-dd'));
			$('#endTime').val($.common.dateFormat(endTime, 'yyyy-MM-dd'));
		}

		// 加载用户操作次数排行
		function loadUserOperRank() {
			var options = {
				url: prefix + "/userOperRank",
				queryParams: queryParams,
				columns: [
					{
						field: 'operName',
						title: '用户名'
					},
					{
						field: 'count',
						title: '操作总次数',
						formatter: function(value, row, index) {
							return row.count || 0;
						}
					},
					{
						field: 'operTime',
						title: '最后操作时间'
					}
				]
			};
			$.table.init(options, "userOperRank-table");
		}

		// 加载用户常用模块统计
		function loadUserCommonModule() {
			var options = {
				url: prefix + "/userCommonModule",
				queryParams: queryParams,
				columns: [
					{
						field: 'operName',
						title: '用户名'
					},
					{
						field: 'title',
						title: '功能模块'
					},
					{
						field: 'count',
						title: '操作次数'
					}
				]
			};
			$.table.init(options, "userCommonModule-table");
		}

		// 加载操作时间段分布
		function loadOperTimeDistribution() {
			var options = {
				url: prefix + "/operTimeDistribution",
				queryParams: queryParams,
				columns: [
					{
						field: 'date',
						title: '日期'
					},
					{
						field: 'count',
						title: '操作次数'
					}
				]
			};
			$.table.init(options, "operTimeDistribution-table");
		}

		function queryParams(params) {
			var search = $.table.queryParams(params);
			search.params = {
				beginTime: beginOfTime($("#startTime").val()),
				endTime: endOfTime($("#endTime").val())
			};
			return search;
		}

		function searchPre() {
			$.table.search('userstat-form', 'userOperRank-table');
			$.table.search('userstat-form', 'userCommonModule-table');
			$.table.search('userstat-form', 'operTimeDistribution-table');
		}

		function resetPre() {
			resetDate();
			$("#userstat-form")[0].reset();
			$.table.search('userstat-form', 'userOperRank-table', 1);
			$.table.search('userstat-form', 'userCommonModule-table', 1);
			$.table.search('userstat-form', 'operTimeDistribution-table', 1);
		}
	</script>
</body>
</html>
